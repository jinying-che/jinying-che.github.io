<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Noto Sans SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#646A73"/></marker></defs>
<rect x="0" y="0" width="1400" height="760" fill="#FFFFFF"/>
<text x="700.0" y="50" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2329">Where Gateway Errors Come From</text>
<text x="700.0" y="80" text-anchor="middle" font-size="14" fill="#8F959E">Behind a reverse proxy, the same 5xx can mean very different failures</text>
<rect x="40" y="110" width="1320" height="560" rx="8" fill="#F7F8FA" stroke="#DEE0E3" stroke-width="1"/>
<text x="460.0" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#646A73">what the client sees</text>
<text x="940.0" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#646A73">what went wrong upstream</text>
<rect x="110.0" y="160" width="220" height="64" rx="6" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="220" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">Client</text>
<text x="220" y="209" text-anchor="middle" font-size="13" fill="#8F959E">browser / curl</text>
<polyline points="220,224 220,650" fill="none" stroke="#BBBFC4" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="590.0" y="160" width="220" height="64" rx="6" fill="#FFFFFF" stroke="#3370FF" stroke-width="1.5"/>
<text x="700" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">nginx</text>
<text x="700" y="209" text-anchor="middle" font-size="13" fill="#8F959E">reverse proxy</text>
<polyline points="700,224 700,650" fill="none" stroke="#BBBFC4" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="1070.0" y="160" width="220" height="64" rx="6" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="1180" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">Upstream</text>
<text x="1180" y="209" text-anchor="middle" font-size="13" fill="#8F959E">app server</text>
<polyline points="1180,224 1180,650" fill="none" stroke="#BBBFC4" stroke-width="1" stroke-dasharray="5 4"/>
<polyline points="708,280 1172,280" fill="none" stroke="#646A73" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="940.0" y="270" text-anchor="middle" font-size="13" fill="#1F2329">refused / reset / invalid response</text>
<polyline points="692,280 228,280" fill="none" stroke="#646A73" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="345.0" y="263.0" width="230" height="34" rx="17" fill="#FCE9E8" stroke="#E8A19D" stroke-width="1"/>
<text x="460.0" y="285" text-anchor="middle" font-size="13" fill="#B3261E"><tspan font-weight="bold">502</tspan> Bad Gateway</text>
<polyline points="708,360 1172,360" fill="none" stroke="#646A73" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="940.0" y="350" text-anchor="middle" font-size="13" fill="#1F2329">no reply within proxy_read_timeout (60s)</text>
<polyline points="692,360 228,360" fill="none" stroke="#646A73" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="345.0" y="343.0" width="230" height="34" rx="17" fill="#FCE9E8" stroke="#E8A19D" stroke-width="1"/>
<text x="460.0" y="365" text-anchor="middle" font-size="13" fill="#B3261E"><tspan font-weight="bold">504</tspan> Gateway Timeout</text>
<text x="940.0" y="445" text-anchor="middle" font-size="13" fill="#8F959E">never forwarded: limit_req / limit_conn hit</text>
<polyline points="692,440 228,440" fill="none" stroke="#646A73" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="345.0" y="423.0" width="230" height="34" rx="17" fill="#FCE9E8" stroke="#E8A19D" stroke-width="1"/>
<text x="460.0" y="445" text-anchor="middle" font-size="13" fill="#B3261E"><tspan font-weight="bold">503</tspan> Service Unavailable</text>
<polyline points="1172,520 708,520" fill="none" stroke="#646A73" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="940.0" y="510" text-anchor="middle" font-size="13" fill="#1F2329">app bug: upstream returns 500</text>
<polyline points="692,520 228,520" fill="none" stroke="#646A73" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="345.0" y="503.0" width="230" height="34" rx="17" fill="#FCE9E8" stroke="#E8A19D" stroke-width="1"/>
<text x="460.0" y="525" text-anchor="middle" font-size="13" fill="#B3261E"><tspan font-weight="bold">500</tspan> passed through</text>
<polyline points="228,600 692,600" fill="none" stroke="#646A73" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="460.0" y="590" text-anchor="middle" font-size="13" fill="#1F2329">client closes connection before reply</text>
<rect x="825.0" y="583.0" width="230" height="34" rx="17" fill="#F2F3F5" stroke="#BBBFC4" stroke-width="1" stroke-dasharray="4 3"/>
<text x="940.0" y="605" text-anchor="middle" font-size="13" fill="#646A73"><tspan font-weight="bold">499</tspan> in access.log only</text>
<rect x="40" y="690" width="1320" height="44" rx="6" fill="#FFFFFF" stroke="#3370FF" stroke-width="1.5"/>
<text x="700.0" y="718" text-anchor="middle" font-size="14" fill="#1F2329"><tspan font-weight="bold">502</tspan> upstream answered badly   ·   <tspan font-weight="bold">504</tspan> upstream did not answer in time   ·   <tspan font-weight="bold">503</tspan> deliberately not serving   ·   <tspan font-weight="bold">499</tspan> client hung up</text>
</svg>