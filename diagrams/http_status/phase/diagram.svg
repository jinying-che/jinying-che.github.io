<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="740" viewBox="0 0 1550 740" font-family="Noto Sans SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#646A73"/></marker></defs>
<rect x="0" y="0" width="1550" height="740" fill="#FFFFFF"/>
<text x="775.0" y="50" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2329">HTTP Status Code by Request Phase</text>
<text x="775.0" y="80" text-anchor="middle" font-size="14" fill="#8F959E">The first digit tells who must act: 4xx = fix the request, 5xx = the server side failed</text>
<rect x="30" y="110" width="240" height="510" rx="8" fill="#F7F8FA" stroke="#DEE0E3" stroke-width="1"/>
<text x="46" y="136" font-size="14" font-weight="bold" fill="#646A73">Client</text>
<rect x="280" y="110" width="240" height="510" rx="8" fill="#FFF9EB" stroke="#F0D9A0" stroke-width="1"/>
<text x="296" y="136" font-size="14" font-weight="bold" fill="#646A73">Edge</text>
<rect x="530" y="110" width="990" height="510" rx="8" fill="#F3F7FE" stroke="#C9D7F2" stroke-width="1"/>
<text x="546" y="136" font-size="14" font-weight="bold" fill="#646A73">Origin Server</text>
<rect x="50" y="150" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="150.0" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">Client</text>
<text x="150.0" y="202" text-anchor="middle" font-size="13" fill="#8F959E">browser / curl / SDK</text>
<rect x="300" y="150" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#3370FF" stroke-width="1.5"/>
<text x="400.0" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">Proxy / Gateway</text>
<text x="400.0" y="202" text-anchor="middle" font-size="13" fill="#8F959E">nginx / LB / CDN</text>
<rect x="550" y="150" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="650.0" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">Parse Request</text>
<text x="650.0" y="202" text-anchor="middle" font-size="13" fill="#8F959E">method, headers, body</text>
<rect x="800" y="150" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="900.0" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">Auth</text>
<text x="900.0" y="202" text-anchor="middle" font-size="13" fill="#8F959E">who are you? allowed?</text>
<rect x="1050" y="150" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="1150.0" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">Route & Resource</text>
<text x="1150.0" y="202" text-anchor="middle" font-size="13" fill="#8F959E">find the target</text>
<rect x="1300" y="150" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="1400.0" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">Handler</text>
<text x="1400.0" y="202" text-anchor="middle" font-size="13" fill="#8F959E">business logic</text>
<polyline points="250,185.0 300,185.0" fill="none" stroke="#8F959E" stroke-width="1.5" marker-end="url(#arr)"/>
<polyline points="500,185.0 550,185.0" fill="none" stroke="#8F959E" stroke-width="1.5" marker-end="url(#arr)"/>
<polyline points="750,185.0 800,185.0" fill="none" stroke="#8F959E" stroke-width="1.5" marker-end="url(#arr)"/>
<polyline points="1000,185.0 1050,185.0" fill="none" stroke="#8F959E" stroke-width="1.5" marker-end="url(#arr)"/>
<polyline points="1250,185.0 1300,185.0" fill="none" stroke="#8F959E" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="310" y="250" width="180" height="34" rx="17" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="400.0" y="272" text-anchor="middle" font-size="13" fill="#A15C00"><tspan font-weight="bold">429</tspan> Too Many Requests</text>
<rect x="310" y="294" width="180" height="34" rx="17" fill="#FCE9E8" stroke="#E8A19D" stroke-width="1"/>
<text x="400.0" y="316" text-anchor="middle" font-size="13" fill="#B3261E"><tspan font-weight="bold">502</tspan> Bad Gateway</text>
<rect x="310" y="338" width="180" height="34" rx="17" fill="#FCE9E8" stroke="#E8A19D" stroke-width="1"/>
<text x="400.0" y="360" text-anchor="middle" font-size="13" fill="#B3261E"><tspan font-weight="bold">503</tspan> Service Unavailable</text>
<rect x="310" y="382" width="180" height="34" rx="17" fill="#FCE9E8" stroke="#E8A19D" stroke-width="1"/>
<text x="400.0" y="404" text-anchor="middle" font-size="13" fill="#B3261E"><tspan font-weight="bold">504</tspan> Gateway Timeout</text>
<rect x="560" y="250" width="180" height="34" rx="17" fill="#F1EEFC" stroke="#B3A6E6" stroke-width="1"/>
<text x="650.0" y="272" text-anchor="middle" font-size="13" fill="#5B45B0"><tspan font-weight="bold">100</tspan> Continue</text>
<rect x="560" y="294" width="180" height="34" rx="17" fill="#F1EEFC" stroke="#B3A6E6" stroke-width="1"/>
<text x="650.0" y="316" text-anchor="middle" font-size="13" fill="#5B45B0"><tspan font-weight="bold">101</tspan> Switching Protocols</text>
<rect x="560" y="338" width="180" height="34" rx="17" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="650.0" y="360" text-anchor="middle" font-size="13" fill="#A15C00"><tspan font-weight="bold">400</tspan> Bad Request</text>
<rect x="560" y="382" width="180" height="34" rx="17" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="650.0" y="404" text-anchor="middle" font-size="13" fill="#A15C00"><tspan font-weight="bold">413</tspan> Content Too Large</text>
<rect x="560" y="426" width="180" height="34" rx="17" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="650.0" y="448" text-anchor="middle" font-size="13" fill="#A15C00"><tspan font-weight="bold">431</tspan> Headers Too Large</text>
<rect x="560" y="470" width="180" height="34" rx="17" fill="#FCE9E8" stroke="#E8A19D" stroke-width="1"/>
<text x="650.0" y="492" text-anchor="middle" font-size="13" fill="#B3261E"><tspan font-weight="bold">501</tspan> Not Implemented</text>
<rect x="810" y="250" width="180" height="34" rx="17" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="900.0" y="272" text-anchor="middle" font-size="13" fill="#A15C00"><tspan font-weight="bold">401</tspan> Unauthorized</text>
<rect x="810" y="294" width="180" height="34" rx="17" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="900.0" y="316" text-anchor="middle" font-size="13" fill="#A15C00"><tspan font-weight="bold">403</tspan> Forbidden</text>
<rect x="1060" y="250" width="180" height="34" rx="17" fill="#E8F0FD" stroke="#A3C0EE" stroke-width="1"/>
<text x="1150.0" y="272" text-anchor="middle" font-size="13" fill="#2C5AA0"><tspan font-weight="bold">301 / 308</tspan> Permanent</text>
<rect x="1060" y="294" width="180" height="34" rx="17" fill="#E8F0FD" stroke="#A3C0EE" stroke-width="1"/>
<text x="1150.0" y="316" text-anchor="middle" font-size="13" fill="#2C5AA0"><tspan font-weight="bold">302 / 307</tspan> Temporary</text>
<rect x="1060" y="338" width="180" height="34" rx="17" fill="#E8F0FD" stroke="#A3C0EE" stroke-width="1"/>
<text x="1150.0" y="360" text-anchor="middle" font-size="13" fill="#2C5AA0"><tspan font-weight="bold">304</tspan> Not Modified</text>
<rect x="1060" y="382" width="180" height="34" rx="17" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="1150.0" y="404" text-anchor="middle" font-size="13" fill="#A15C00"><tspan font-weight="bold">404</tspan> Not Found</text>
<rect x="1060" y="426" width="180" height="34" rx="17" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="1150.0" y="448" text-anchor="middle" font-size="13" fill="#A15C00"><tspan font-weight="bold">405</tspan> Method Not Allowed</text>
<rect x="1060" y="470" width="180" height="34" rx="17" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="1150.0" y="492" text-anchor="middle" font-size="13" fill="#A15C00"><tspan font-weight="bold">412</tspan> Precondition Failed</text>
<rect x="1310" y="250" width="180" height="34" rx="17" fill="#E8F5E8" stroke="#A3D3A3" stroke-width="1"/>
<text x="1400.0" y="272" text-anchor="middle" font-size="13" fill="#2E7D32"><tspan font-weight="bold">200</tspan> OK</text>
<rect x="1310" y="294" width="180" height="34" rx="17" fill="#E8F5E8" stroke="#A3D3A3" stroke-width="1"/>
<text x="1400.0" y="316" text-anchor="middle" font-size="13" fill="#2E7D32"><tspan font-weight="bold">201</tspan> Created</text>
<rect x="1310" y="338" width="180" height="34" rx="17" fill="#E8F5E8" stroke="#A3D3A3" stroke-width="1"/>
<text x="1400.0" y="360" text-anchor="middle" font-size="13" fill="#2E7D32"><tspan font-weight="bold">202</tspan> Accepted</text>
<rect x="1310" y="382" width="180" height="34" rx="17" fill="#E8F5E8" stroke="#A3D3A3" stroke-width="1"/>
<text x="1400.0" y="404" text-anchor="middle" font-size="13" fill="#2E7D32"><tspan font-weight="bold">204</tspan> No Content</text>
<rect x="1310" y="426" width="180" height="34" rx="17" fill="#E8F5E8" stroke="#A3D3A3" stroke-width="1"/>
<text x="1400.0" y="448" text-anchor="middle" font-size="13" fill="#2E7D32"><tspan font-weight="bold">206</tspan> Partial Content</text>
<rect x="1310" y="470" width="180" height="34" rx="17" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="1400.0" y="492" text-anchor="middle" font-size="13" fill="#A15C00"><tspan font-weight="bold">409</tspan> Conflict</text>
<rect x="1310" y="514" width="180" height="34" rx="17" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="1400.0" y="536" text-anchor="middle" font-size="13" fill="#A15C00"><tspan font-weight="bold">422</tspan> Unprocessable</text>
<rect x="1310" y="558" width="180" height="34" rx="17" fill="#FCE9E8" stroke="#E8A19D" stroke-width="1"/>
<text x="1400.0" y="580" text-anchor="middle" font-size="13" fill="#B3261E"><tspan font-weight="bold">500</tspan> Internal Error</text>
<rect x="60" y="250" width="180" height="100" rx="6" fill="#FFFFFF" stroke="#BBBFC4" stroke-width="1" stroke-dasharray="4 3"/>
<text x="150" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2329">per request receives</text>
<text x="150" y="304" text-anchor="middle" font-size="13" fill="#646A73">0..n interim 1xx</text>
<text x="150" y="328" text-anchor="middle" font-size="13" fill="#646A73">exactly 1 final 2xx-5xx</text>
<rect x="30" y="645" width="290" height="56" rx="6" fill="#F1EEFC" stroke="#B3A6E6" stroke-width="1"/>
<text x="175.0" y="669" text-anchor="middle" font-size="14" font-weight="bold" fill="#5B45B0">1xx Informational</text>
<text x="175.0" y="689" text-anchor="middle" font-size="13" fill="#646A73">not done yet</text>
<rect x="330" y="645" width="290" height="56" rx="6" fill="#E8F5E8" stroke="#A3D3A3" stroke-width="1"/>
<text x="475.0" y="669" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">2xx Success</text>
<text x="475.0" y="689" text-anchor="middle" font-size="13" fill="#646A73">done</text>
<rect x="630" y="645" width="290" height="56" rx="6" fill="#E8F0FD" stroke="#A3C0EE" stroke-width="1"/>
<text x="775.0" y="669" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C5AA0">3xx Redirection</text>
<text x="775.0" y="689" text-anchor="middle" font-size="13" fill="#646A73">look elsewhere</text>
<rect x="930" y="645" width="290" height="56" rx="6" fill="#FDF2E0" stroke="#E9BE72" stroke-width="1"/>
<text x="1075.0" y="669" text-anchor="middle" font-size="14" font-weight="bold" fill="#A15C00">4xx Client Error</text>
<text x="1075.0" y="689" text-anchor="middle" font-size="13" fill="#646A73">fix the request</text>
<rect x="1230" y="645" width="290" height="56" rx="6" fill="#FCE9E8" stroke="#E8A19D" stroke-width="1"/>
<text x="1375.0" y="669" text-anchor="middle" font-size="14" font-weight="bold" fill="#B3261E">5xx Server Error</text>
<text x="1375.0" y="689" text-anchor="middle" font-size="13" fill="#646A73">server side failed</text>
</svg>