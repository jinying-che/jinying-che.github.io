<text x="700" y="608" text-anchor="middle" font-size="14" fill="#1F2329">Control plane down → in-cluster agents go down with it   ·   host vmagent keeps running   →   <tspan font-weight="bold">up{job="apiserver"} == 0</tspan> fires the alert</text>
