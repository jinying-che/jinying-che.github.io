<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Archive | Jinying Tech Blog</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f8f8f4;
      --surface: #fff;
      --text: #192621;
      --muted: #4c5d52;
      --line: #d6ddd6;
      --field-border: #87948b;
      --accent: #215d46;
      --hover: #eff5ee;
      font: 16px/1.5 system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
    }

    [hidden] { display: none !important; }

    a {
      color: var(--accent);
      text-underline-offset: .2em;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .wrap {
      width: min(54rem, calc(100% - 2.5rem));
      margin-inline: auto;
    }

    header {
      border-top: 4px solid var(--accent);
      border-bottom: 1px solid var(--line);
    }

    .blog-link {
      display: inline-block;
      padding: .9rem 0;
      color: var(--text);
      font-size: .9rem;
      font-weight: 650;
      text-decoration: none;
    }

    .blog-link:hover { text-decoration: underline; }

    main {
      padding-block: clamp(2.25rem, 6vw, 4.75rem);
    }

    h1 {
      margin: 0 0 1.6rem;
      font: 400 clamp(2.7rem, 7vw, 4.5rem)/1.05 Georgia, serif;
      letter-spacing: -.045em;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 12rem;
      gap: .85rem 1rem;
      align-items: end;
    }

    label {
      display: block;
      margin-bottom: .35rem;
      font-size: .875rem;
      font-weight: 650;
    }

    input, select {
      width: 100%;
      min-height: 2.85rem;
      padding: .55rem .75rem;
      border: 1px solid var(--field-border);
      border-radius: .4rem;
      background-color: var(--surface);
      color: var(--text);
      font: inherit;
    }

    input::placeholder, .status, .path, time { color: var(--muted); }

    .status {
      margin: 1.5rem 0 .5rem;
      font-size: .875rem;
    }

    .results {
      margin: 0;
      padding: 0;
      list-style: none;
      border-block: 1px solid var(--line);
    }

    .results li + li { border-top: 1px solid var(--line); }

    .result {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: .25rem 1.25rem;
      padding: 1rem .75rem;
      color: var(--text);
      text-decoration: none;
    }

    .result:hover, .result:focus-visible { background: var(--hover); }

    .title {
      color: var(--accent);
      font-size: 1.125rem;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .result:hover .title, .result:focus-visible .title { text-decoration: underline; }

    .path {
      display: block;
      margin-top: .2rem;
      font-size: .875rem;
      overflow-wrap: anywhere;
    }

    time {
      padding-top: .15rem;
      font-size: .875rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .empty {
      padding: 1.6rem;
      border: 1px solid var(--line);
      border-radius: .5rem;
      background: var(--surface);
    }

    .empty h2 {
      margin: 0 0 .3rem;
      font-size: 1.125rem;
    }

    .empty p {
      margin: 0;
      color: var(--muted);
    }

    @media (max-width: 35rem) {
      .controls, .result { grid-template-columns: minmax(0, 1fr); }
      .result { padding-inline: .25rem; }
      .empty { padding: 1.15rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="blog-link" href="https://chejinying.com/tech/">Jinying Tech Blog</a>
    </div>
  </header>
  <main class="wrap">
    <h1>HTML Archive</h1>
    <div class="controls" id="controls" hidden>
      <div>
        <label for="search">Search pages</label>
        <input id="search" type="search" placeholder="Search titles and page text">
      </div>
      <div>
        <label for="order">Date created</label>
        <select id="order">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </div>
    </div>
    <p class="status" id="status" role="status" aria-atomic="true"></p>
    <ul class="results" id="results" aria-label="HTML pages" hidden></ul>
    <div class="empty" id="empty" hidden>
      <h2 id="empty-title"></h2>
      <p id="empty-message"></p>
    </div>
    <noscript>Enable JavaScript to browse and search the HTML archive.</noscript>
  </main>
  <script type="application/json" id="archive-data">[]</script>
  <script>
    const search = document.getElementById("search");
    const order = document.getElementById("order");
    const status = document.getElementById("status");
    const list = document.getElementById("results");
    const empty = document.getElementById("empty");
    const emptyTitle = document.getElementById("empty-title");
    const emptyMessage = document.getElementById("empty-message");
    const dateFormat = new Intl.DateTimeFormat("en", { dateStyle: "medium", timeZone: "UTC" });
    const normalize = text => text.normalize("NFKC").toLowerCase();
    const newestFirst = JSON.parse(document.getElementById("archive-data").textContent)
      .map(({ text, ...page }) => ({
        ...page,
        searchText: normalize([page.title, page.path, text].join(" ")),
        timestamp: Date.parse(page.created),
      }))
      .sort((a, b) => b.timestamp - a.timestamp || a.path.localeCompare(b.path));
    const oldestFirst = [...newestFirst]
      .sort((a, b) => a.timestamp - b.timestamp || a.path.localeCompare(b.path));

    function resultItem(page) {
      const item = document.createElement("li");
      const link = document.createElement("a");
      link.className = "result";
      link.href = page.href;

      const details = document.createElement("span");
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = page.title;
      const path = document.createElement("span");
      path.className = "path";
      path.textContent = page.path;
      details.append(title, path);

      const date = document.createElement("time");
      date.dateTime = page.created;
      date.textContent = dateFormat.format(page.timestamp);
      link.append(details, date);
      item.append(link);
      return item;
    }

    function render() {
      const query = normalize(search.value).trim();
      const terms = query ? query.split(/\s+/) : [];
      const pages = order.value === "oldest" ? oldestFirst : newestFirst;
      const matches = pages.filter(page => terms.every(term => page.searchText.includes(term)));
      list.replaceChildren(...matches.map(resultItem));
      list.hidden = matches.length === 0;
      empty.hidden = matches.length > 0;
      status.textContent = query
        ? `${matches.length} of ${pages.length} pages`
        : `${pages.length} ${pages.length === 1 ? "page" : "pages"}`;
      if (!matches.length) {
        emptyTitle.textContent = query ? "No matching pages" : "No pages yet";
        emptyMessage.textContent = query
          ? "Try a different search."
          : "Published HTML pages will appear here.";
      }
    }

    search.addEventListener("input", render);
    order.addEventListener("change", render);
    document.getElementById("controls").hidden = false;
    render();
  </script>
</body>
</html>
