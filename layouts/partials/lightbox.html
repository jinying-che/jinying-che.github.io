<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button class="lightbox-close" type="button" aria-label="Close">✕</button>
  <div class="lightbox-stage">
    <img class="lightbox-img" alt="">
  </div>
</div>

<script>
(function () {
  var box = document.getElementById('lightbox');
  if (!box) return;
  var stage = box.querySelector('.lightbox-stage');
  var img = box.querySelector('.lightbox-img');
  var closeBtn = box.querySelector('.lightbox-close');
  var lastFocus = null;

  function open(link) {
    var thumb = link.querySelector('img');
    img.src = link.getAttribute('href');
    img.alt = thumb ? thumb.alt : '';
    box.classList.remove('is-zoomed');
    box.hidden = false;
    document.documentElement.classList.add('lightbox-open');
    lastFocus = link;
    closeBtn.focus();
  }

  function close() {
    box.hidden = true;
    box.classList.remove('is-zoomed');
    document.documentElement.classList.remove('lightbox-open');
    img.removeAttribute('src');
    if (lastFocus) lastFocus.focus();
  }

  document.addEventListener('click', function (e) {
    var link = e.target.closest('a.zoomable');
    if (!link || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    open(link);
  });

  // click the image: toggle between fit-to-screen and actual size
  img.addEventListener('click', function (e) {
    e.stopPropagation();
    var rect = img.getBoundingClientRect();
    var fx = (e.clientX - rect.left) / rect.width;
    var fy = (e.clientY - rect.top) / rect.height;
    box.classList.toggle('is-zoomed');
    if (box.classList.contains('is-zoomed')) {
      // keep the clicked point under the cursor
      stage.scrollLeft = fx * img.offsetWidth - stage.clientWidth / 2;
      stage.scrollTop = fy * img.offsetHeight - stage.clientHeight / 2;
    }
  });

  stage.addEventListener('click', function (e) {
    if (e.target === stage) close();
  });
  closeBtn.addEventListener('click', close);
  document.addEventListener('keydown', function (e) {
    if (!box.hidden && e.key === 'Escape') close();
  });
})();
</script>
