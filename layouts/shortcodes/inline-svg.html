{{- $src := .Get 0 -}}
{{- $label := .Get 1 -}}
{{- $dialogID := printf "inline-svg-dialog-%d" .Ordinal -}}
{{- $svg := readFile (printf "static/%s" $src) -}}
<div
  class="inline-svg"
  role="button"
  tabindex="0"
  aria-label="Enlarge {{ $label }}"
  aria-haspopup="dialog"
  aria-controls="{{ $dialogID }}"
  title="Click to enlarge"
  onclick="if (!window.getSelection().toString()) { event.preventDefault(); document.getElementById('{{ $dialogID }}').showModal(); }"
  onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); document.getElementById('{{ $dialogID }}').showModal(); }"
>
  {{- $svg | safeHTML -}}
</div>
<dialog
  id="{{ $dialogID }}"
  class="inline-svg-dialog"
  aria-label="{{ $label }}"
  onclick="if (event.target === this) this.close()"
>
  <button class="inline-svg-dialog__close" type="button" aria-label="Close enlarged diagram" onclick="this.closest('dialog').close()">&times;</button>
  <div class="inline-svg-dialog__image" role="img" aria-label="{{ $label }}">
    {{- $svg | safeHTML -}}
  </div>
</dialog>
